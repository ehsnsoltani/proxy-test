name: Pinggy TCP Proxy Test

on:
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: System info
        run: |
          uname -a
          echo "Public IP:"
          curl -4 api.ipify.org
          echo


      - name: Install 3proxy
        run: |
          sudo apt update
          sudo apt install -y git build-essential curl openssh-client

          git clone https://github.com/z3APA3A/3proxy.git

          cd 3proxy
          make -f Makefile.Linux

          sudo cp bin/3proxy /usr/local/bin/3proxy

          3proxy -v || true


      - name: Configure and start 3proxy
        run: |

          cat > 3proxy.cfg <<'EOF'
daemon
nscache 65536
nserver 8.8.8.8
nserver 1.1.1.1
timeouts 1 5 30 60 1800 1800 60 60 10 15
auth none
proxy -p9000
EOF


          nohup 3proxy 3proxy.cfg > 3proxy.log 2>&1 &


          sleep 5


          echo "========== 3PROXY LOG =========="
          cat 3proxy.log || true


          echo "========== PORT CHECK =========="
          ss -lntp | grep 9000 || true


          echo "========== LOCAL PROXY TEST =========="
          curl \
          -x http://127.0.0.1:9000 \
          http://example.com \
          -v || true



      - name: Start Pinggy TCP tunnel with retry
        run: |

          echo "Starting Pinggy tunnel"


          for i in 1 2 3 4 5
          do

            echo "========== ATTEMPT $i =========="


            rm -f pinggy.log


            nohup ssh \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              -o ExitOnForwardFailure=yes \
              -p 443 \
              -R0:localhost:9000 \
              tcp@a.pinggy.io \
              > pinggy.log 2>&1 &


            PID=$!


            sleep 20


            echo "========== PINGGY LOG =========="
            cat pinggy.log || true



            if grep -Eqi "allocated port|forwarding|tcp" pinggy.log
            then

              echo "Pinggy tunnel established"
              break

            fi



            echo "Pinggy failed"

            kill $PID || true

            sleep 5


          done



      - name: Keep alive
        run: |

          echo "Proxy is running..."

          while true
          do
            sleep 60
          done
