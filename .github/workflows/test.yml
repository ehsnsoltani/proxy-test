name: Proxy Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Check system
        run: |
          uname -a
          curl api.ipify.org


      - name: Install 3proxy
        run: |
          sudo apt update
          sudo apt install -y git build-essential wget

          git clone https://github.com/z3APA3A/3proxy.git
          cd 3proxy
          make -f Makefile.Linux

          sudo cp bin/3proxy /usr/local/bin/


      - name: Start proxy
        run: |
          cat > 3proxy.cfg <<EOF
          daemon
          nscache 65536
          nserver 8.8.8.8
          nserver 1.1.1.1

          auth none

          timeouts 1 5 30 60 180 1800 15 60

          proxy -p9000
          EOF

          3proxy 3proxy.cfg &

          sleep 5

          echo "Testing local HTTP proxy..."
          curl -x http://127.0.0.1:9000 http://example.com -v


      - name: Test HTTPS from runner
        run: |
          echo "Testing Google HTTPS..."
          curl -x http://127.0.0.1:9000 https://www.google.com -v

          echo "Testing Cloudflare HTTPS..."
          curl -x http://127.0.0.1:9000 https://www.cloudflare.com -v


      - name: Install bore
        run: |
          wget -q https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz

          tar -xzf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz

          chmod +x bore

          sudo mv bore /usr/local/bin/


      - name: Start bore tunnel
        run: |
          bore local 9000 --to bore.pub
