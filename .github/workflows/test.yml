      - name: Install zrok
        run: |
          sudo apt update
          sudo apt install -y jq

          URL=$(curl -s https://api.github.com/repos/openziti/zrok/releases/latest \
          | jq -r '.assets[].browser_download_url' \
          | grep linux \
          | grep amd64 \
          | head -n1)

          echo "Downloading:"
          echo "$URL"

          wget "$URL" -O zrok.tar.gz

          echo "========== TAR CONTENT =========="
          tar -tzf zrok.tar.gz

          tar -xzf zrok.tar.gz

          echo "========== AFTER EXTRACT =========="
          find . -maxdepth 3 -type f

          ZROK=$(find . -type f -name "zrok" | head -n1)

          echo "Binary found:"
          echo "$ZROK"

          sudo install "$ZROK" /usr/local/bin/zrok

          zrok version
