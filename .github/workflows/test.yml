name: Proxy Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check system
        run: |
          uname -a
          curl api.ipify.org

      - name: Install 3proxy
        run: |
          sudo apt update
          sudo apt install -y git build-essential

          git clone https://github.com/z3APA3A/3proxy.git
          cd 3proxy
          make -f Makefile.Linux

          sudo cp bin/3proxy /usr/local/bin/

      - name: Start proxy
        run: |
          cat > 3proxy.cfg <<EOF
          daemon
          nscache 65536
          nserver 8.8.8.8
          nserver 1.1.1.1
          auth none
          proxy -p9000
          EOF

          3proxy 3proxy.cfg &
          sleep 5

          curl -x http://127.0.0.1:9000 http://example.com -v

      - name: Keep alive
        run: |
          echo "Proxy test running"
          sleep 3600
