name: Inbound Port Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show network info
        run: |
          echo "Hostname:"
          hostname

          echo "Internal IP:"
          hostname -I

          echo "Public IP:"
          curl https://checkip.amazonaws.com

          echo "Listening ports:"
          sudo ss -tlnp

      - name: Start HTTP server
        run: |
          mkdir test-page
          echo "HELLO FROM GITHUB ACTIONS RUNNER" > test-page/index.html

          cd test-page

          nohup python3 -m http.server 9000 > server.log 2>&1 &

          sleep 5

          echo "Local test:"
          curl http://127.0.0.1:9000

          echo "Ports after server:"
          sudo ss -tlnp

      - name: Keep alive
        run: |
          echo "Runner alive"
          sleep 3600
