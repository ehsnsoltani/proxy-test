name: Cloudflare Tunnel Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Install 3proxy
        run: |
          sudo apt update
          sudo apt install -y git build-essential wget

          git clone https://github.com/z3APA3A/3proxy.git
          cd 3proxy
          make -f Makefile.Linux

          sudo cp bin/3proxy /usr/local/bin/

      - name: Configure 3proxy
        run: |
          cat > 3proxy.cfg <<EOF
          daemon
          nscache 65536
          nserver 8.8.8.8
          nserver 1.1.1.1
          auth none
          proxy -p9000
          EOF

          3proxy 3proxy.cfg

          sleep 5

          echo "Testing local proxy..."

          curl -x http://127.0.0.1:9000 https://www.google.com -I -v


      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared-linux-amd64.deb


      - name: Start Cloudflare TCP Tunnel
        run: |
          nohup cloudflared tunnel \
          --url tcp://localhost:9000 \
          > cloudflared.log 2>&1 &


          sleep 15

          echo "========== CLOUDFLARE LOG =========="
          cat cloudflared.log


      - name: Keep alive
        run: |
          echo "Running..."
          sleep 3600
