name: localhost-run TCP Proxy Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: System info
        run: |
          uname -a
          echo "Public IP:"
          curl -4 api.ipify.org
          echo


      - name: Install 3proxy
        run: |
          sudo apt update
          sudo apt install -y git build-essential curl wget openssh-client

          git clone https://github.com/z3APA3A/3proxy.git

          cd 3proxy
          make -f Makefile.Linux

          sudo cp bin/3proxy /usr/local/bin/3proxy


      - name: Start 3proxy
        run: |
          printf '%s\n' \
          'daemon' \
          'nscache 65536' \
          'nserver 8.8.8.8' \
          'nserver 1.1.1.1' \
          'auth none' \
          'proxy -p9000' \
          > 3proxy.cfg

          nohup 3proxy 3proxy.cfg > 3proxy.log 2>&1 &

          sleep 5

          echo "========== 3PROXY LOG =========="
          cat 3proxy.log || true

          echo "========== PORTS =========="
          ss -lntp | grep 9000 || true

          echo "========== LOCAL TEST =========="
          curl -x http://127.0.0.1:9000 http://example.com -v || true


      - name: Start localhost.run TCP tunnel
        run: |
          echo "Starting localhost.run..."

          nohup ssh \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=60 \
          -o ExitOnForwardFailure=yes \
          -R 0:localhost:9000 \
          localhost.run \
          > localhostrun.log 2>&1 &

          sleep 20

          echo "========== LOCALHOST.RUN LOG =========="
          cat localhostrun.log || true


      - name: Keep alive
        run: |
          echo "Proxy is running..."

          while true
          do
            sleep 60
          done
