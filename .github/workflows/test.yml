name: zrok TCP Proxy Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: System info
        run: |
          uname -a
          echo "Public IP:"
          curl -4 api.ipify.org
          echo


      - name: Install 3proxy
        run: |
          sudo apt update
          sudo apt install -y git build-essential curl wget

          git clone https://github.com/z3APA3A/3proxy.git

          cd 3proxy
          make -f Makefile.Linux

          sudo cp bin/3proxy /usr/local/bin/


      - name: Start 3proxy
        run: |
          cat > 3proxy.cfg <<'EOF'
daemon
nscache 65536
nserver 8.8.8.8
nserver 1.1.1.1
auth none
proxy -p9000
EOF

          nohup 3proxy 3proxy.cfg > 3proxy.log 2>&1 &

          sleep 5

          echo "3proxy status:"
          ss -lntp | grep 9000 || true

          echo "Local test:"
          curl -x http://127.0.0.1:9000 http://example.com


      - name: Install zrok
        run: |
          wget -q https://github.com/openziti/zrok/releases/latest/download/zrok-linux-amd64.tar.gz -O zrok.tar.gz

          tar -xzf zrok.tar.gz

          sudo mv zrok /usr/local/bin/zrok

          chmod +x /usr/local/bin/zrok

          zrok version


      - name: Enable zrok
        run: |
          zrok enable "V0OUklFRSSiy"


      - name: Start zrok tunnel
        run: |
          nohup zrok share public tcp://127.0.0.1:9000 \
          --headless \
          > zrok.log 2>&1 &

          sleep 20

          echo "========== ZROK LOG =========="
          cat zrok.log


      - name: Keep alive
        run: |
          echo "Running..."
          while true
          do
            sleep 60
          done
