      - name: Install zrok
        run: |
          sudo apt update
          sudo apt install -y jq curl wget

          URL=$(curl -s https://api.github.com/repos/openziti/zrok/releases/latest \
          | jq -r '.assets[].browser_download_url' \
          | grep linux \
          | grep amd64 \
          | head -n1)

          echo "Downloading:"
          echo "$URL"

          wget "$URL" -O zrok.tar.gz

          echo "========== TAR CONTENT =========="
          tar -tzf zrok.tar.gz

          tar -xzf zrok.tar.gz

          echo "========== AFTER EXTRACT =========="
          ls -la

          sudo install ./zrok2 /usr/local/bin/zrok

          sudo chmod +x /usr/local/bin/zrok

          echo "========== ZROK VERSION =========="
          zrok version
